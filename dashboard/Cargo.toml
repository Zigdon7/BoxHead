[package]
name = "boxhead-dashboard"
version = "0.1.0"
edition = "2021"
description = "Ops dashboard: monitors BoxHead game servers and their parallel room simulation threads"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
futures = "0.3"
